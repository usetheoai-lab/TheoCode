# The five gates this repository declares, run on every pull request.
#
# B-015: `.github` had never existed across 383 commits. Five gates were declared in
# `package.json` and every one of them passed only when a human remembered to run it. A gate
# nobody runs is documentation.
#
# One workflow, five jobs, and every one of them blocking — deliberately. No job is allowed to
# report a failure as a pass; a job that cannot fail is the gate that motivated this file, one
# layer down. `crossval` was RED when this work
# started (31 closed items with no `fixed_in`); it was made green BEFORE this file landed, because
# a gate wired in red is a gate everyone learns to ignore.
#
# Five jobs rather than one: a single job stops at the first failure and hides the other four.
# Each pays its own `npm ci`, which is the price of independent red/green.
#
# ---------------------------------------------------------------------------------------------
# B-062: these five checks are not required. Nothing here blocks a merge.
#
# Read "blocking" above in its narrow sense: no job reports a failure as a pass. It does NOT mean
# GitHub refuses the merge. It does not, and cannot at this tier. Measured 2026-08-19 with a token
# holding `permissions.admin: true` on this repository:
#
#   gh api repos/usetheoai-lab/TheoCode/branches/develop/protection
#     403  Upgrade to GitHub Pro or make this repository public to enable this feature.
#   gh api repos/usetheoai-lab/TheoCode/branches/main/protection
#     403  Upgrade to GitHub Pro or make this repository public to enable this feature.
#   gh api repos/usetheoai-lab/TheoCode/rulesets
#     403  Upgrade to GitHub Pro or make this repository public to enable this feature.
#   gh api orgs/usetheoai-lab/rulesets
#     403  Upgrade to GitHub Team to enable this feature.
#
# Rulesets are the newer mechanism and were measured, not assumed: refused on all three surfaces.
# There is no free-tier route to a required check on a private repository. It is a billing wall,
# not a permission we lack and not a file we forgot to write — `main` is as unprotected as
# `develop`.
#
# What holds the line today is a person waiting for five green ticks — usually. Surveyed at the
# same time: 25 merged PRs (#25 through #49, every integer in that range), none of which merged
# with a red rollup, and the six most recent merged 20-49 seconds after the last check completed.
#
# One merge landed with NO check completed, which is the reason "usually" is the honest word.
# (#34 also merged with an incomplete rollup, but a full green set had completed 74s earlier — the
# remaining entries were a duplicate run. #33 had none.) **PR #33 merged at 14:56:45Z,
# one second after its checks STARTED, with zero of them completed** (the last finished at
# 14:57:55Z). It went green afterwards, so it is not in the "merged red" count — but nothing
# gated it. The umbrella backlog records that as B-070: the merge guard read an EMPTY
# `statusCheckRollup` and matched neither IN_PROGRESS nor QUEUED, so the wait loop passed it
# through. The practice is correct; a practice is not a control, and that PR is the proof.
#
# The compensating control is that guard — B-070. The limit that FAILED on #33 is that a rollup can
# legitimately be empty, and the guard read empty as nothing-to-wait-for. A second limit, which did
# not fail here, is that it runs on one person's machine. There is no
# repository-side layer at all: `core.hooksPath` is unset and `.git/hooks` holds only samples.
#
# Three ways out, and NONE has been chosen:
#   * buy GitHub Team for `usetheoai-lab` — the tier the org-ruleset refusal names. No price is
#     quoted here because this measurement did not take one, and inventing one would be fabrication
#   * make this repository public — removes the wall for free, and is irreversible in practice:
#     the full history becomes readable. A disclosure decision, not a CI one
#   * accept the gap — which is where we are by default, not by decision
#
# The choice costs money or discloses source and belongs to the account owner, so this file records
# the state of the decision rather than making it. This comment is NOT an approval of the gap.
#
# FALSIFIER — one ungated command, runnable verbatim:
#
#   gh api repos/usetheoai-lab/TheoCode/branches --jq '.[] | {name, protected}'
#
# It reports `protected: false` for every branch today. A row reading `protected: true` means this
# stanza is stale; a changed SET of rows is only branch churn. Nothing runs it automatically.
#
# What it does NOT prove, stated because the first draft of this stanza overclaimed it: a green
# result is consistent with a paid tier where nobody configured protection, so `protected: false`
# does not by itself establish the billing wall. Re-run the four API calls above for that.
# ---------------------------------------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `tools/check-english-only.mjs` reads the SYSTEM word lists and exits 1 when it cannot find
      # them — "a guard that passes when it cannot check is worse than no guard, because it is
      # believed" (its own words). Those lists ship on a developer's Ubuntu and not on a runner, so
      # the gate was passing locally and failing here. Declaring the dependency is the fix;
      # weakening the guard so it reports clean without a lexicon is the defect it warns about.
      # B-073 — bounded because it hung. Measured 2026-08-19 on run 32269423670: this step sat
      # `in_progress` for 21 minutes with no output and did not respond to a cancel, blocking a PR
      # whose other four jobs were green in under two minutes. It is the only step here that talks
      # to a network mirror, so it is the only one that can hang on something outside this repo.
      # A ceiling turns an indefinite block into a fast red, which is the whole of fail-fast
      # (`rules/error-handling.md` § 1): a gate that can hang forever is a gate nobody can trust to
      # report.
      - name: Provide word lists (skip apt when the image already has them)
        run: |
          set -u
          # B-073 — ASK BEFORE INSTALLING. `check-english-only.mjs` accepts any of these paths, and
          # the runner image may already carry one; three consecutive runs on 2026-08-19 exhausted
          # every apt retry against a mirror that stalls with zero output, so an install we do not
          # need is an outage we do not need to survive. This also prints what IS present, which is
          # the measurement the workflow never made.
          echo "--- dictionaries present before any install:"
          ls -1 /usr/share/dict/ 2>/dev/null || echo "  (no /usr/share/dict)"
          ls -1 /usr/share/hunspell/ 2>/dev/null || echo "  (no /usr/share/hunspell)"

          have_en=0; have_pt=0
          for f in /usr/share/dict/american-english /usr/share/dict/words /usr/share/hunspell/en_US.dic; do
            [ -s "$f" ] && have_en=1
          done
          for f in /usr/share/dict/brazilian /usr/share/dict/portuguese /usr/share/hunspell/pt_BR.dic; do
            [ -s "$f" ] && have_pt=1
          done
          if [ "$have_en" = 1 ] && [ "$have_pt" = 1 ]; then
            echo "both dictionaries already present — apt not needed"
            exit 0
          fi
          # B-073 bullet 3 — install ONLY what is missing. Measured 2026-08-19 on `ubuntu-24.04`:
          # `/usr/share/hunspell/en_US.dic` ships with the image, so `have_en` is 1 and `wamerican`
          # was being fetched for nothing. Half the download and half the surface that can stall,
          # bought with no benefit. The check stays CONDITIONAL rather than hard-coded to
          # `wbrazilian`, because "the image always has English" is a fact about today's image and
          # this step already exists to stop assuming things about it.
          pkgs=""
          [ "$have_en" = 0 ] && pkgs="$pkgs wamerican"
          [ "$have_pt" = 0 ] && pkgs="$pkgs wbrazilian"
          echo "missing (en=$have_en pt=$have_pt) — installing:$pkgs"

          for attempt in 1 2 3; do
            # `timeout` per ATTEMPT, not per step: the failure is a silent stall with zero output,
            # so a whole-step ceiling can only report the death, never recover from it.
            if timeout 90 sudo apt-get update -qq \
               && timeout 90 sudo apt-get install -y -qq $pkgs; then
              echo "word lists installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed or stalled; backing off" >&2
            sleep $((attempt * 15))
          done
          echo "::error::apt could not provide$pkgs after 3 attempts." >&2
          echo "check-english-only.mjs needs a dictionary and fails closed without one, so this" >&2
          echo "job is RED rather than silently skipping the language gate." >&2
          exit 1
        timeout-minutes: 8
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `tools/check-english-only.mjs` reads the SYSTEM word lists and exits 1 when it cannot find
      # them — "a guard that passes when it cannot check is worse than no guard, because it is
      # believed" (its own words). Those lists ship on a developer's Ubuntu and not on a runner, so
      # the gate was passing locally and failing here. Declaring the dependency is the fix;
      # weakening the guard so it reports clean without a lexicon is the defect it warns about.
      # B-073 — bounded because it hung. Measured 2026-08-19 on run 32269423670: this step sat
      # `in_progress` for 21 minutes with no output and did not respond to a cancel, blocking a PR
      # whose other four jobs were green in under two minutes. It is the only step here that talks
      # to a network mirror, so it is the only one that can hang on something outside this repo.
      # A ceiling turns an indefinite block into a fast red, which is the whole of fail-fast
      # (`rules/error-handling.md` § 1): a gate that can hang forever is a gate nobody can trust to
      # report.
      - name: Provide word lists (skip apt when the image already has them)
        run: |
          set -u
          # B-073 — ASK BEFORE INSTALLING. `check-english-only.mjs` accepts any of these paths, and
          # the runner image may already carry one; three consecutive runs on 2026-08-19 exhausted
          # every apt retry against a mirror that stalls with zero output, so an install we do not
          # need is an outage we do not need to survive. This also prints what IS present, which is
          # the measurement the workflow never made.
          echo "--- dictionaries present before any install:"
          ls -1 /usr/share/dict/ 2>/dev/null || echo "  (no /usr/share/dict)"
          ls -1 /usr/share/hunspell/ 2>/dev/null || echo "  (no /usr/share/hunspell)"

          have_en=0; have_pt=0
          for f in /usr/share/dict/american-english /usr/share/dict/words /usr/share/hunspell/en_US.dic; do
            [ -s "$f" ] && have_en=1
          done
          for f in /usr/share/dict/brazilian /usr/share/dict/portuguese /usr/share/hunspell/pt_BR.dic; do
            [ -s "$f" ] && have_pt=1
          done
          if [ "$have_en" = 1 ] && [ "$have_pt" = 1 ]; then
            echo "both dictionaries already present — apt not needed"
            exit 0
          fi
          echo "missing (en=$have_en pt=$have_pt) — installing"

          for attempt in 1 2 3; do
            # `timeout` per ATTEMPT, not per step: the failure is a silent stall with zero output,
            # so a whole-step ceiling can only report the death, never recover from it.
            if timeout 90 sudo apt-get update -qq \
               && timeout 90 sudo apt-get install -y -qq wamerican wbrazilian; then
              echo "word lists installed on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed or stalled; backing off" >&2
            sleep $((attempt * 15))
          done
          echo "::error::apt could not provide wamerican/wbrazilian after 3 attempts." >&2
          echo "check-english-only.mjs needs a dictionary and fails closed without one, so this" >&2
          echo "job is RED rather than silently skipping the language gate." >&2
          exit 1
        timeout-minutes: 8
      - run: npm ci
      - run: npm run lint

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run depcruise

  crossval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` is load-bearing: the check resolves every `fixed_in` sha against the
      # history. A shallow clone makes real commits look like fabricated ones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run crossval
