# The workspace roots. Without this key pnpm sees no packages at all — the file was left
# holding only the `allowBuilds` prompt pnpm writes when it needs a decision, so `pnpm install`
# resolved nothing and the tree it produced could not typecheck.
packages:
  - packages/*

# The four internal packages depend on each other as `"@theocode/agent": "*"`. pnpm defaults to the
# registry for a bare range and 404s on `@theocode/agent`, which is not published and never will be.
# This makes pnpm read `*` as "the local one".
#
# This comment used to end by requiring that BOTH package managers install from the same manifests,
# because CI ran `npm ci` in all five jobs. That invariant was retired on 2026-09-02, and it is worth
# saying why rather than letting the next reader wonder: npm could not honour the `overrides` below.
# Measured with an exact pin and a full `npm install`, not `--package-lock-only`, it resolved
# `@theokit/sdk@4.55.0` and reported the violation while carrying on — `invalid: "^4.63.3"` in
# `npm ls`, exit 0. pnpm resolves the same manifest correctly, so the two managers produced different
# trees from identical inputs and only one of them was ever run by CI.
#
# That is not a preference between tools. A CI that installs a different dependency graph than the
# developer is not evidence about the developer's tree, and this repository had already paid for that
# twice (56ea1a1, and usetheoai-lab/TheoCode#69). CI now runs `pnpm install --frozen-lockfile` in all
# five jobs and `package-lock.json` is gitignored: one manager, one lockfile, one tree.
linkWorkspacePackages: true

# esbuild ships a platform binary and needs its postinstall to run; `tools/build-cli.mjs` and
# `npm run build:acp` both invoke it. Denying the build leaves the bundler installed and unable
# to execute.
allowBuilds:
  esbuild: true
  # node-pty is a NATIVE addon. Without its postinstall there is no compiled binding, and
  # `interactive_shell` / `write_stdin` — the two tools backed by `PtyInteractiveBackend` — fail at
  # the point the model reaches for a REPL. Denying this build does not degrade a feature, it
  # removes one.
  node-pty: true

minimumReleaseAgeExclude:
  - '@theokit/agents@11.0.0'
  - '@theokit/presenter@0.8.0'
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - typescript-eslint@8.68.0
  - '@theokit/tui@0.78.0 || 0.80.0'
  - '@theokit/sdk@5.0.0-next.4'

# The transitive `@theokit/sdk` is what carries `prompt_cache_key` and the cached-token read
# (published 4.55.0). `@theokit/agents` asks for `^4.52.1`, which a stale lock happily satisfied with
# 4.53.1 while node_modules held a 4.54.0-labelled local tarball — three sources disagreeing about
# one package. Pinning the floor here makes the resolution answer to something a reader can check.
# theokit prereleases are the default here, not the exception: TheoCode is the consumer that
# exercises theokit, so staying on `latest` means validating code the team already fixed. Measured
# 2026-09-02 — `theokit-sdk#523` (lossy replay) and `#524` (the `.claude/` opt-in) were both fixed
# and both reachable only from `5.0.0-next.1`, with `latest` at `4.63.3`.
#
# The version is pinned exactly rather than ranged because no stable range accepts a prerelease:
# `^5.0.0` and `>=5.0.0` both reject `5.0.0-next.1`. The override is also the ONLY route — nothing
# in `packages/*/src` imports `@theokit/sdk` (there is a test asserting that), so it arrives as a
# transitive dependency of `@theokit/agents@12.1.0`, which declares `^4.52.1`. Upstream will not
# raise that floor while only a prerelease exists (usetheokit/theokit#634), and overriding it here
# is what lets agents resolve the newer SDK. Verified in the installed tree, not on paper: agents
# resolves to `@theokit+sdk@5.0.0-next.1`, typecheck clean, 776 tests green.
overrides:
  '@theokit/sdk': '5.0.0-next.4'
